name: Preserve account state during image rollout
on:
  workflow_dispatch:
    inputs:
      api_commit:
        description: Approved running API image commit (40 hex)
        type: string
        required: true
      batch_commit:
        description: Approved running batch image commit (40 hex)
        type: string
        required: true
      next_commit:
        description: Approved prebuilt image source commit
        type: string
        required: true
      next_image_digest:
        description: Approved registry manifest digest (sha256)
        type: string
        required: true
      schema_compatible_confirmed:
        description: Reviewed release has no incompatible DB or ledger migration; image rollback is valid
        type: boolean
        default: false
      operation:
        description: Explicit single step; no member-action activation
        type: choice
        options: [check, apply-image]
        default: check
      deployment_freeze_confirmed:
        description: Operator confirmed no other deployments or manual configuration changes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: toilet-batch-production
  cancel-in-progress: false
jobs:
  rollout:
    if: >-
      github.repository == 'toilet-project/toilet-batch' &&
      github.ref == 'refs/heads/main' &&
      vars.ACCOUNT_ROLLOUT_RELEASE_APPROVED == 'true' &&
      vars.ACCOUNT_ROLLOUT_APPROVED_SHA == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate pinned request before accessing transport credentials
        shell: bash
        env:
          API_COMMIT: ${{ inputs.api_commit }}
          BATCH_COMMIT: ${{ inputs.batch_commit }}
          APPROVED_API_COMMIT: ${{ vars.ACCOUNT_ROLLOUT_API_COMMIT }}
          APPROVED_BATCH_COMMIT: ${{ vars.ACCOUNT_ROLLOUT_BATCH_COMMIT }}
          OPERATION: ${{ inputs.operation }}
          NEXT_COMMIT: ${{ inputs.next_commit }}
          NEXT_DIGEST: ${{ inputs.next_image_digest }}
          APPROVED_NEXT_COMMIT: ${{ vars.ACCOUNT_ROLLOUT_NEXT_COMMIT }}
          APPROVED_NEXT_DIGEST: ${{ vars.ACCOUNT_ROLLOUT_NEXT_IMAGE_DIGEST }}
          SCHEMA: ${{ inputs.schema_compatible_confirmed }}
          FREEZE: ${{ inputs.deployment_freeze_confirmed }}
        run: |
          set -euo pipefail
          [[ "$API_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BATCH_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$NEXT_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$NEXT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$NEXT_COMMIT" = "$APPROVED_NEXT_COMMIT"
          test "$NEXT_DIGEST" = "$APPROVED_NEXT_DIGEST"
          test "$API_COMMIT" = "$APPROVED_API_COMMIT"
          test "$BATCH_COMMIT" = "$APPROVED_BATCH_COMMIT"
          case "$OPERATION" in
            check) ;;
            apply-image) test "$FREEZE" = true; test "$SCHEMA" = true ;;
            *) exit 1 ;;
          esac
          python3 -B -m unittest discover -s scripts -p test_account_resume_transition.py
      - name: Prepare pinned Tunnel client
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.8.3/cloudflared-linux-amd64.deb \
            -o "$RUNNER_TEMP/cloudflared.deb"
          printf '%s  %s\n' 660b348d473bba81997445b534e7eaefaf4c4e16331866922326c338a7013dd9 "$RUNNER_TEMP/cloudflared.deb" | sha256sum -c -
          dpkg-deb --extract "$RUNNER_TEMP/cloudflared.deb" "$RUNNER_TEMP/cloudflared-package"
      - name: Roll out one approved image without changing account state over pinned SSH
        shell: bash
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.TUNNEL_DEPLOY_ACCESS_CLIENT_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.MINI_PC_KEY }}
          TUNNEL_KNOWN_HOSTS: ${{ secrets.TUNNEL_DEPLOY_SSH_KNOWN_HOSTS }}
          TUNNEL_SSH_HOST: ${{ vars.TUNNEL_DEPLOY_SSH_HOST }}
          TUNNEL_SSH_USER: ${{ secrets.MINI_PC_USERNAME }}
          API_COMMIT: ${{ inputs.api_commit }}
          BATCH_COMMIT: ${{ inputs.batch_commit }}
          OPERATION: ${{ inputs.operation }}
          NEXT_COMMIT: ${{ inputs.next_commit }}
          NEXT_DIGEST: ${{ inputs.next_image_digest }}
          APPROVED_NEXT_COMMIT: ${{ vars.ACCOUNT_ROLLOUT_NEXT_COMMIT }}
          APPROVED_NEXT_DIGEST: ${{ vars.ACCOUNT_ROLLOUT_NEXT_IMAGE_DIGEST }}
          SCHEMA: ${{ inputs.schema_compatible_confirmed }}
          FREEZE: ${{ inputs.deployment_freeze_confirmed }}
        run: |
          set -euo pipefail
          umask 077
          : "${TUNNEL_SERVICE_TOKEN_ID:?missing Access ID}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?missing Access secret}"
          test "$TUNNEL_SSH_HOST" = ssh-deploy.geupddong.com
          [[ "$TUNNEL_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$API_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BATCH_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$NEXT_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$NEXT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          test "$NEXT_COMMIT" = "$APPROVED_NEXT_COMMIT"
          test "$NEXT_DIGEST" = "$APPROVED_NEXT_DIGEST"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/account-resume-key"
          printf '%s\n' "$TUNNEL_KNOWN_HOSTS" > "$RUNNER_TEMP/account-resume-hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/account-resume-key" >/dev/null
          remote="python3 -B - --role batch --phase preserve --api-commit $API_COMMIT --batch-commit $BATCH_COMMIT --next-commit $NEXT_COMMIT --next-image-digest $NEXT_DIGEST"
          case "$OPERATION" in
            check) ;;
            apply-image)
              test "$FREEZE" = true
              test "$SCHEMA" = true
              remote="$remote --apply-approved --deployment-freeze-confirmed --schema-compatible-confirmed"
              ;;
            *) exit 1 ;;
          esac
          export PATH="$RUNNER_TEMP/cloudflared-package/usr/bin:$PATH"
          # Never retry a lost acknowledgement: inspect the actual host phase first.
          timeout 10m ssh -F /dev/null -T -i "$RUNNER_TEMP/account-resume-key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/account-resume-hosts" \
            -o HostKeyAlias=geupddong-mini-pc -o HostKeyAlgorithms=ssh-ed25519 \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o 'ProxyCommand=cloudflared access ssh --hostname %h' \
            "$TUNNEL_SSH_USER@$TUNNEL_SSH_HOST" "$remote" < scripts/account_resume_transition.py
      - name: Remove runner-only credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:?}"
          rm -f -- "$RUNNER_TEMP/account-resume-key" "$RUNNER_TEMP/account-resume-hosts"
