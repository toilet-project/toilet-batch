name: R2 erasure ledger live verification
on:
  push:
    branches: [feature/account-withdrawal-retention]
    paths:
      - '.github/workflows/erasure-ledger-live.yml'
      - 'src/test/java/com/geupddong/account/ErasureLedgerLiveTest.java'
permissions:
  contents: read
concurrency:
  group: erasure-ledger-live-verification
  cancel-in-progress: false
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile without secrets
        run: |
          chmod +x gradlew
          ./gradlew testClasses --no-daemon --console=plain
      - name: Synthetic encrypted R2 verify-cleanup
        env:
          ERASURE_LIVE_CHECK: 'true'
          ERASURE_LIVE_MODE: 'verify-cleanup'
          ERASURE_LEDGER_ACCESS_KEY_ID: ${{ secrets.ERASURE_LEDGER_ACCESS_KEY_ID }}
          ERASURE_LEDGER_SECRET_ACCESS_KEY: ${{ secrets.ERASURE_LEDGER_SECRET_ACCESS_KEY }}
          ERASURE_LEDGER_KEYS_JSON: ${{ secrets.ERASURE_LEDGER_KEYS_JSON }}
          ACCOUNT_RETENTION_ENABLED: 'false'
          ACCOUNT_ERASURE_ENABLED: 'false'
        run: ./gradlew test --tests '*ErasureLedgerLiveTest' --rerun-tasks --no-daemon --console=plain
      - name: Result summary
        if: success()
        run: echo 'Synthetic R2 verification passed. No database, Redis, deployment, or user records accessed.' >> "$GITHUB_STEP_SUMMARY"

