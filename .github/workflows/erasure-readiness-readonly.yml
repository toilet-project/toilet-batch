name: R2 readiness read-only observation
on:
  push:
    branches: [feature/account-withdrawal-retention]
    paths:
      - '.github/workflows/erasure-readiness-readonly.yml'
      - 'src/test/java/com/geupddong/account/ErasureReadinessLiveTest.java'
permissions:
  contents: read
concurrency:
  group: erasure-readiness-readonly
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile without secrets
        run: |
          chmod +x gradlew
          ./gradlew testClasses --no-daemon --console=plain
      - name: Read-only R2 presence check
        env:
          ERASURE_READINESS_READ_ONLY: 'true'
          ERASURE_LEDGER_ENDPOINT: https://1611d88218de929b3ed6e2cd7c863be5.r2.cloudflarestorage.com
          ERASURE_LEDGER_BUCKET: geupddong-account-erasure-ledger
          ERASURE_LEDGER_ACCESS_KEY_ID: ${{ secrets.ERASURE_LEDGER_ACCESS_KEY_ID }}
          ERASURE_LEDGER_SECRET_ACCESS_KEY: ${{ secrets.ERASURE_LEDGER_SECRET_ACCESS_KEY }}
          ERASURE_LEDGER_KEYS_JSON: ${{ secrets.ERASURE_LEDGER_KEYS_JSON }}
        run: |
          ./gradlew test --tests '*ErasureReadinessLiveTest' --no-daemon --console=plain
          # Test stdout is a fixed allowlisted set of non-identifying booleans.
          sed -n '/R2_READONLY_BUCKET_ACCESS_OK/p; /R2_OBSERVED_BUCKET_EMPTY=/p; /R2_PRODUCTION_INTENT_PRESENT=/p; /R2_PRODUCTION_CATALOGUE_PRESENT=/p; /R2_BASELINE_ESTABLISHED=/p; /R2_OBJECT_CONTENTS_READ=/p' build/test-results/test/TEST-com.geupddong.account.ErasureReadinessLiveTest.xml | tee -a "$GITHUB_STEP_SUMMARY"
