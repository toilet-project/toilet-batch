name: Account erasure isolated validation
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [feature/account-withdrawal-retention]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/prepare-account-lifecycle.test.mjs scripts/us-ledger-preparation.test.mjs
      - run: node --test scripts/deployment-safety.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-erasure-test-results
          path: build/reports/tests/test
  synthetic-review-restore:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: synthetic-review-restore-only
        ports:
          - 43317:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic-review-restore-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      REVIEW_RESTORE_CI: 'true'
      REVIEW_RESTORE_CI_URL: jdbc:mysql://127.0.0.1:43317
      REVIEW_RESTORE_CI_USER: root
      REVIEW_RESTORE_CI_PASSWORD: synthetic-review-restore-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew test --tests com.geupddong.review.CombinedRestoreMySqlTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-review-restore-results
          path: build/reports/tests/test
          retention-days: 3
