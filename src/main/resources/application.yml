server:
  port: ${BATCH_PORT}

spring:
  datasource:
    url: ${SPRING_DB_URL}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  task:
    scheduling:
      pool:
        size: 1

public-data:
  restroom:
    base-url: https://apis.data.go.kr/1741000/public_restroom_info_v2
    service-key: ${PUBLIC_DATA_API_KEY:}
    page-size: 100

batch:
  restroom-sync:
    cron: "0 0 2 * * *"
    zone: Asia/Seoul
    overlap-days: 3
    max-attempts: 3
