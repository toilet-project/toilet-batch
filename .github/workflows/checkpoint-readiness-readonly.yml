name: Independent checkpoint read-only readiness
on:
  workflow_dispatch:
  push:
    branches: [feature/account-withdrawal-retention]
    paths: ['.github/workflows/checkpoint-readiness-readonly.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew
      - name: Read existing private checkpoint only
        env:
          ERASURE_CHECKPOINT_READONLY_CHECK: 'true'
          ERASURE_CHECKPOINT_GITHUB_TOKEN: ${{ secrets.ERASURE_CHECKPOINT_GITHUB_TOKEN }}
          ERASURE_CHECKPOINT_DATABASE_EPOCH: ${{ vars.ERASURE_CHECKPOINT_DATABASE_EPOCH }}
        run: ./gradlew --no-daemon test --tests 'com.geupddong.account.CheckpointReadinessLiveTest'
