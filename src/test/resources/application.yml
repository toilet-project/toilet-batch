server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:toilet_batch_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

batch:
  restroom-sync:
    cron: "-"
    zone: Asia/Seoul
    overlap-days: 3
    max-attempts: 3
