name: Account erasure isolated validation
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [feature/account-withdrawal-retention]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/prepare-account-lifecycle.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-erasure-test-results
          path: build/reports/tests/test
