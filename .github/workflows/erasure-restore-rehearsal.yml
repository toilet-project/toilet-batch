name: Encrypted backup erasure rehearsal
on:
  push:
    branches: [feature/account-withdrawal-retention]
    paths:
      - '.github/workflows/erasure-restore-rehearsal.yml'
      - 'scripts/mysql-restore-erasure-verify.sh'
      - 'src/main/java/com/example/toiletbatch/account/AccountErasureRestoreCli.java'
      - 'src/test/java/com/geupddong/account/AccountRestoreRehearsalLiveTest.java'
      - 'src/test/resources/account-erasure-restore-fixture.sql'
permissions:
  contents: read
concurrency:
  group: encrypted-backup-erasure-rehearsal
  cancel-in-progress: false
jobs:
  synthetic-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare standalone tools and isolated database image without secrets
        run: |
          chmod +x gradlew
          bash -n scripts/mysql-restore-erasure-verify.sh
          ./gradlew installErasureTools testClasses --no-daemon --console=plain
          docker pull mysql:8.0.46
      - name: Encrypted synthetic backup and R2 replay
        env:
          ERASURE_RESTORE_LIVE_CHECK: 'true'
          ERASURE_LEDGER_ACCESS_KEY_ID: ${{ secrets.ERASURE_LEDGER_ACCESS_KEY_ID }}
          ERASURE_LEDGER_SECRET_ACCESS_KEY: ${{ secrets.ERASURE_LEDGER_SECRET_ACCESS_KEY }}
          ERASURE_LEDGER_KEYS_JSON: ${{ secrets.ERASURE_LEDGER_KEYS_JSON }}
          ACCOUNT_RETENTION_ENABLED: 'false'
          ACCOUNT_ERASURE_ENABLED: 'false'
        run: ./gradlew test --tests '*AccountRestoreRehearsalLiveTest' --rerun-tasks --no-daemon --console=plain
      - name: Require actual test execution and no disposable containers left
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse('build/test-results/test/TEST-com.geupddong.account.AccountRestoreRehearsalLiveTest.xml').getroot()
          for failure in r.findall('.//failure'):
              message = failure.get('message', '')
              if message.startswith('java.lang.AssertionError: RESTORE_REHEARSAL_'):
                  print(message[:300])
          assert r.get('tests') == '1' and all(r.get(k) == '0' for k in ['failures', 'errors', 'skipped'])
          print('Encrypted restore, erasure replay, inventory refusal and synthetic cleanup passed')
          PY
          test -z "$(docker ps -aq --filter label=geupddong.erasure.verify)"
          test -z "$(docker network ls -q --filter label=geupddong.erasure.verify)"
          echo 'Synthetic encrypted backup restore and erasure replay passed. Production untouched.' >> "$GITHUB_STEP_SUMMARY"
