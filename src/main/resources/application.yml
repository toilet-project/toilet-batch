server:
  port: ${BATCH_PORT}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: ${SPRING_DB_URL}
    username: ${SPRING_DB_USERNAME}
    password: ${SPRING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      data-source-properties:
        connectionTimeZone: Asia/Seoul
        forceConnectionTimeZoneToSession: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul

  sql:
    init:
      mode: always

  task:
    scheduling:
      pool:
        size: 1

public-data:
  restroom:
    base-url: https://apis.data.go.kr/1741000/public_restroom_info_v2
    service-key: ${PUBLIC_DATA_API_KEY:}
    page-size: 100

kakao:
  geocoding:
    base-url: https://dapi.kakao.com
    rest-api-key: ${KAKAO_REST_API_KEY:}

account:
  lifecycle:
    maintenance: ${ACCOUNT_LIFECYCLE_MAINTENANCE:true}

batch:
  account-erasure:
    enabled: ${ACCOUNT_ERASURE_ENABLED:false}
    max-per-run: ${ACCOUNT_ERASURE_MAX_PER_RUN:5000}
  restroom-sync:
    cron: "0 0 2 * * *"
    zone: Asia/Seoul
    overlap-days: 3
    max-attempts: 3
  notification:
    webhook-url: ${BATCH_FAILURE_WEBHOOK_URL:}

management:
  health:
    redis:
      enabled: ${ACCOUNT_ERASURE_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: toilet-batch
erasure:
  ledger:
    enabled: ${ERASURE_LEDGER_ENABLED:false}
    catalogue-enabled: ${ERASURE_LEDGER_CATALOGUE_ENABLED:false}
    realm: ${ERASURE_LEDGER_REALM:production}
    bucket: ${ERASURE_LEDGER_BUCKET:geupddong-account-erasure-ledger}
    endpoint: ${ERASURE_LEDGER_ENDPOINT:}
    access-key-id: ${ERASURE_LEDGER_ACCESS_KEY_ID:}
    secret-access-key: ${ERASURE_LEDGER_SECRET_ACCESS_KEY:}
    active-key-id: ${ERASURE_LEDGER_ACTIVE_KEY_ID:k1}
    keys-json: ${ERASURE_LEDGER_KEYS_JSON:}
