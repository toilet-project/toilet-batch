name: Duplicate facility validation
on:
  pull_request:
    paths: ['src/**', '.github/workflows/duplicate-facility-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew test bootJar --no-daemon --console=plain
  coordinate-metadata-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: synthetic-batch-metadata-only
        ports:
          - 43318:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psynthetic-batch-metadata-only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BATCH_METADATA_MYSQL_CI: 'true'
      BATCH_METADATA_MYSQL_URL: jdbc:mysql://127.0.0.1:43318
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew test --tests com.example.toiletbatch.batch.ToiletCoordinateMetadataRepositoryMySqlTest --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinate-metadata-mysql-results
          path: build/test-results/test
          retention-days: 7
