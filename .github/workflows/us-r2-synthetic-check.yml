name: Isolated US R2 synthetic check
on:
  push:
    branches: [verification/r2-us-20260908]
    paths:
      - '.github/workflows/us-r2-synthetic-check.yml'
      - 'scripts/us-r2-synthetic-check.cjs'
permissions:
  contents: read
concurrency:
  group: isolated-us-r2-synthetic-check
  cancel-in-progress: false
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline guards
        run: node scripts/us-r2-synthetic-check.cjs --self-test
      - name: Encrypted synthetic object round trip and owned cleanup
        env:
          US_SYNTHETIC_CHECK: approved
          TEST_ENDPOINT_HOST: ${{ vars.ERASURE_LEDGER_US_TEST_ENDPOINT_HOST }}
          TEST_BUCKET: ${{ vars.ERASURE_LEDGER_US_TEST_BUCKET }}
          TEST_ACCESS_KEY_ID: ${{ secrets.ERASURE_LEDGER_US_TEST_ACCESS_KEY_ID }}
          TEST_SECRET_ACCESS_KEY: ${{ secrets.ERASURE_LEDGER_US_TEST_SECRET_ACCESS_KEY }}
        run: node scripts/us-r2-synthetic-check.cjs
