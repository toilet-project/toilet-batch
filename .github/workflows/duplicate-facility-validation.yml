name: Duplicate facility validation
on:
  pull_request:
    paths: ['src/**', '.github/workflows/duplicate-facility-validation.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew test bootJar --no-daemon --console=plain
