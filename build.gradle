plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'toilet-batch'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'software.amazon.awssdk:s3:2.54.13'
    implementation 'software.amazon.awssdk:url-connection-client:2.54.13'
    // 1. Web & JPA (필수)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // 2. DB Driver
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // 3. DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 4. Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 5. Test 관련
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    inputs.property('erasureBackupBash', System.getenv('ERASURE_BACKUP_BASH') ?: '')
    inputs.property('erasureBackupScriptPath', System.getenv('ERASURE_BACKUP_SCRIPT') ?: '')
    if (System.getenv('ERASURE_BACKUP_SCRIPT')) {
        inputs.file(System.getenv('ERASURE_BACKUP_SCRIPT')).withPropertyName('erasureBackupScript')
    }
    inputs.property('accountRetentionMySqlMarker', System.getenv('ACCOUNT_RETENTION_MYSQL_MARKER') ?: '')
    inputs.property('accountRetentionMySqlPort', System.getenv('ACCOUNT_RETENTION_MYSQL_PORT') ?: '')
    useJUnitPlatform()
}

// Isolated read-only-by-default administrative region analysis, not the normal batch application.
tasks.register('regionNormalize', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.toiletbatch.region.RegionNormalizationCli'
}

tasks.register('accountErasureRestore', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.toiletbatch.account.AccountErasureRestoreCli'
}

// Standalone CLI classpath; no application server, scheduler, DB or Redis auto-configuration.
tasks.register('installErasureTools', Sync) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar'))
    from(configurations.runtimeClasspath.filter { !it.name.startsWith('spring-boot-devtools-') })
    into(layout.buildDirectory.dir('erasure-tools/lib'))
}

// Build-only test bundle. It never reads credentials or contacts the provider during packaging.
// The standalone entry point refuses non-approved/non-test targets at runtime.
tasks.register('packageNcloudKrVerification', Sync) {
    dependsOn tasks.named('testClasses')
    from(sourceSets.main.output.classesDirs) { into 'classes' }
    from(sourceSets.test.output.classesDirs) {
        include 'com/geupddong/account/NcloudKrJavaLiveTest*.class'
        into 'classes'
    }
    from(sourceSets.test.runtimeClasspath.filter { it.isFile() }) { into 'lib' }
    into(layout.buildDirectory.dir('ncloud-kr-verification'))
}

// Offline packaging only. The entry point permits only a fresh, marked synthetic directory on Linux.
tasks.register('packageLocalLedgerVerification', Sync) {
    dependsOn tasks.named('testClasses')
    from(sourceSets.main.output.classesDirs) { into 'classes' }
    from(sourceSets.test.output.classesDirs) {
        include 'com/geupddong/account/LocalLedgerLinuxVerification*.class'
        into 'classes'
    }
    from(sourceSets.test.runtimeClasspath.filter { it.isFile() }) { into 'lib' }
    into(layout.buildDirectory.dir('local-ledger-verification'))
}

// Synthetic-only filesystem/process interruption verification. Does not package credentials.
tasks.register('packageRetirementVerification', Sync) {
    dependsOn tasks.named('testClasses')
    from(sourceSets.main.output.classesDirs) { into 'classes' }
    from(sourceSets.test.output.classesDirs) { into 'classes' }
    from(sourceSets.test.runtimeClasspath.filter { it.isFile() }) { into 'lib' }
    into(layout.buildDirectory.dir('retirement-verification'))
}
