name: Toilet Batch CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 실행 권한 부여 및 빌드
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # 4. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Docker 이미지 빌드 및 Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/toilet-batch:latest

      # 6. 미니 PC에 SSH 접속하여 배포 실행 (.env 자동 생성)
      - name: Deploy to Mini PC via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MINI_PC_HOST }}
          port: ${{ secrets.MINI_PC_PORT }}
          username: ${{ secrets.MINI_PC_USERNAME }}
          key: ${{ secrets.MINI_PC_KEY }}
          script: |
            mkdir -p ~/toilet-batch
            cd ~/toilet-batch

            # GitHub Secrets 내용으로 .env 파일 생성
            cat <<EOF > .env
            BATCH_PORT=${{ secrets.BATCH_PORT }}
            SPRING_DB_URL=${{ secrets.SPRING_DB_URL }}
            SPRING_DB_USERNAME=${{ secrets.SPRING_DB_USERNAME }}
            SPRING_DB_PASSWORD=${{ secrets.SPRING_DB_PASSWORD }}
            PUBLIC_DATA_API_KEY=${{ secrets.PUBLIC_DATA_API_KEY }}
            EOF

            cat <<EOF > docker-compose.yml
            services:
              toilet-batch:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/toilet-batch:latest
                container_name: toilet-batch
                restart: always
                env_file:
                  - .env
                networks:
                  - toilet-network

            networks:
              toilet-network:
                external: true
            EOF

            docker compose pull
            docker compose up -d --build
            docker image prune -af --filter "until=24h"
